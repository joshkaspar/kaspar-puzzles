<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rack &amp; Resonance: result screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&amp;family=VT323&amp;display=swap">
<style>
body{margin:0;background:#121110}
a{color:#e0b23a}a:hover{color:#f3cf6a}
.crt{font-family:'VT323',monospace;color:#86f7a0;text-shadow:0 0 4px rgba(134,247,160,.9),0 0 12px rgba(134,247,160,.45)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 20px; background: #121110; display: flex; flex-direction: column; gap: 14px; font-family: 'Jost', sans-serif">

<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
<defs>
<radialGradient id="gCap" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d3d0c9"/><stop offset="1" stop-color="#77736b"/></radialGradient>
<filter id="fDrop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx=".5" dy="1.1" stdDeviation=".8" flood-color="#000" flood-opacity=".75"/></filter>
<filter id="fPhos" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
</svg>

<div style="position: relative; height: 40px; border-radius: 8px; border: 3px solid #1b1a18; background: linear-gradient(180deg, #0f2a17, #030904); box-shadow: inset 0 0 16px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.1), 0 4px 8px rgba(0,0,0,.7); overflow: hidden">
<div class="crt" style="position: relative; height: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; font-size: 22px; letter-spacing: 1px">
<span>PATCH 0142</span><span>COMPLETE</span><span>06:48</span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,.3) 0 1px, rgba(0,0,0,0) 1px 3px)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0) 50%)"></div>
</div>

<div style="position: relative; border-radius: 10px; padding: 18px 18px 14px; background: linear-gradient(180deg, #2b2b29, #121211); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.8), 0 6px 14px rgba(0,0,0,.75); display: flex; flex-direction: column; gap: 10px">
<svg viewBox="0 0 354 12" width="100%" height="12" aria-hidden="true" style="position: absolute; top: 4px; left: 0"><g filter="url(#fDrop)"><circle cx="9" cy="6" r="3" fill="url(#gCap)"/><circle cx="345" cy="6" r="3" fill="url(#gCap)"/></g><path d="M7.4 6h3.2M9 4.4v3.2M343.4 6h3.2M345 4.4v3.2" stroke="#4a4740" stroke-width=".7"/></svg>
<div style="position: relative; height: 216px; border-radius: 20px; border: 4px solid #0a0a09; background: radial-gradient(ellipse at 50% 45%, #10301a, #030904 75%); box-shadow: inset 0 0 30px rgba(0,0,0,.95), 0 0 0 1px #3a3a38; overflow: hidden">
<svg viewBox="0 0 320 208" width="100%" height="208" role="img" aria-label="Wireframe plot of the finished patch's waveform">
<g fill="none" stroke="#86f7a0" stroke-linejoin="round" filter="url(#fPhos)">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="14">
<polyline points="{{line.pts}}" stroke-opacity="{{line.op}}" stroke-width="{{line.w}}"/>
</sc-for>
</g>
<text x="14" y="198" font-family="VT323" font-size="15" fill="#86f7a0" fill-opacity=".85">OSC › FILTER › FOLD › SCOPE · LFO</text>
</svg>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,.28) 0 1px, rgba(0,0,0,0) 1px 3px)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 30% 10%, rgba(255,255,255,.14), rgba(255,255,255,0) 45%)"></div>
</div>
<div style="text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 4px; color: #f2efe8">SIGNAL DISPLAY</div>
</div>

<div style="position: relative; border-radius: 8px; padding: 16px 18px; background: repeating-linear-gradient(180deg, rgba(255,255,255,.12) 0 1px, rgba(0,0,0,.04) 1px 2px), linear-gradient(180deg, #e6e4de, #b2aea6); box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.7); display: flex; flex-direction: column; gap: 6px; color: #1d1b18">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 4px; text-shadow: 0 1px 0 rgba(255,255,255,.7)">FINAL SCORE</span>
<span class="crt" style="font-size: 38px; line-height: 1; padding: 2px 12px; border-radius: 5px; background: linear-gradient(180deg, #0f2a17, #030904); box-shadow: inset 0 0 10px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.6)">41</span>
</div>
<div style="height: 1px; background: rgba(0,0,0,.25); box-shadow: 0 1px 0 rgba(255,255,255,.6)"></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; letter-spacing: .5px"><span>Patched modules · 5 × 4</span><span>20</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; letter-spacing: .5px"><span>Shaper variety</span><span>+6</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; letter-spacing: .5px"><span>Knobs · modulators on the cable</span><span>+6</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; letter-spacing: .5px"><span>Complete patch</span><span>+10</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; letter-spacing: .5px"><span>Off-cable modules</span><span>+1</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; letter-spacing: .5px"><span>Empty slots · 2</span><span>−2</span></div>
<div style="font-size: 11px; letter-spacing: .5px; color: #46443e; margin-top: 2px">Sample numbers, for layout only</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
<button style="height: 56px; border: none; border-radius: 8px; background: linear-gradient(180deg, #f5eedb, #d6cdb2); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 0 #8c836c, 0 7px 12px rgba(0,0,0,.65); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 4px; color: #1d1b18; text-shadow: 0 1px 0 rgba(255,255,255,.7)">
<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2.5 L13 8 L4 13.5 Z" fill="none" stroke="#1d1b18" stroke-width="1.6" stroke-linejoin="round"/></svg>
PLAY PATCH
</button>
<div style="display: flex; gap: 10px">
<button style="flex: 1; height: 50px; border: none; border-radius: 8px; background: linear-gradient(180deg, #3b3936, #211f1d); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 0 #090908, 0 7px 12px rgba(0,0,0,.65); cursor: pointer; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 3px; color: #f2efe8">SHARE</button>
<button style="flex: 1; height: 50px; border: none; border-radius: 8px; background: linear-gradient(180deg, #3b3936, #211f1d); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 0 #090908, 0 7px 12px rgba(0,0,0,.65); cursor: pointer; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 3px; color: #f2efe8">SEE RACK</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lines = [];
    const n = 14;
    for (let i = 0; i < n; i++) {
      const fold = 1 + i * 0.22;
      const baseY = 168 - i * 9.5;
      const dx = 18 + i * 4;
      const pts = [];
      for (let j = 0; j <= 48; j++) {
        const t = (j / 48) * Math.PI * 4;
        const y = Math.sin(fold * Math.sin(t)) * 18 * (0.6 + 0.4 * Math.cos(j / 48 * Math.PI));
        pts.push((dx + j * 5.2).toFixed(1) + ',' + (baseY - y).toFixed(1));
      }
      lines.push({ pts: pts.join(' '), op: (0.25 + 0.75 * (n - i) / n).toFixed(2), w: i === 0 ? 1.4 : 0.8 });
    }
    return { lines };
  }
}
</script>
</body>
</html>
