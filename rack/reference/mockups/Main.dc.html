<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 0 }; }
  renderVals() {
    const rows = [
      ['empty', 'lfo', 'empty', 'knob', 'empty'],
      ['osc', 'filter', 'tube', 'empty', 'empty'],
      ['jack', 'chip', 'empty', 'empty', 'coil'],
      ['empty', 'empty', 'fold', 'scope', 'out'],
      ['env', 'empty', 'empty', 'empty', 'empty']
    ];
    const lit = { '0-1': true, '1-1': true, '3-2': true, '3-3': true };
    const cells = [];
    rows.forEach((row, r) => row.forEach((k, c) => {
      const on = !!lit[r + '-' + c];
      cells.push({
        isOsc: k === 'osc', isOut: k === 'out', isFilter: k === 'filter', isFold: k === 'fold',
        isScope: k === 'scope', isLfo: k === 'lfo', isEnv: k === 'env',
        isTube: k === 'tube', isKnob: k === 'knob', isJack: k === 'jack', isCoil: k === 'coil', isChip: k === 'chip',
        led: on ? '#ffb13b' : '#3a2a14', glow: on ? 1 : 0
      });
    }));
    const parts = ['TUBE', 'KNOB', 'JACK'];
    const offer = parts.map((label, i) => ({
      label,
      aria: 'Pick ' + label.toLowerCase(),
      isTube: label === 'TUBE', isKnob: label === 'KNOB', isJack: label === 'JACK',
      border: this.state.picked === i ? '2px solid #ffb13b' : '2px solid #2a2420',
      glow: this.state.picked === i ? '0 0 12px rgba(255,177,59,.35)' : '0 0 0 rgba(0,0,0,0)',
      pick: () => this.setState({ picked: i })
    }));
    return { cells, offer };
  }
}
